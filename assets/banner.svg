<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="320" fill="url(#grid)" rx="16"/>

  <!-- Animated Dynamic Decorative Elements (Background Layer) -->
  <g opacity="0.25">
    <!-- Pulsing Orbs -->
    <circle cx="150" cy="80" r="100" fill="#6366f1" filter="url(#glow)">
      <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="240" r="120" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="r" values="100;130;100" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Flowing Pipeline Connections -->
    <path d="M 50,260 Q 300,300 600,260 T 1150,260" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 50,60 Q 300,20 600,60 T 1150,60" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Animated Flow Nodes (Sides/Background - Non-Overlapping with Main Text) -->
  <g transform="translate(80, 110)" opacity="0.7">
    <rect width="90" height="36" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#lightGlow)"/>
    <text x="45" y="23" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Extract</text>
    <animateTransform attributeName="transform" type="translate" values="80,110; 80,105; 80,110" dur="4s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(1030, 110)" opacity="0.7">
    <rect width="90" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#lightGlow)"/>
    <text x="45" y="23" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Transform</text>
    <animateTransform attributeName="transform" type="translate" values="1030,110; 1030,115; 1030,110" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="470" y="42" width="260" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
    <text x="600" y="60" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM ⚡</text>

    <!-- Main Title -->
    <text x="600" y="125" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Data Transformation
    </text>
    <text x="600" y="172" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#lightGlow)">
      Platforms &amp; Tools
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      SQL-First Transformations • Analytics Engineering • Pipeline Orchestration • Open Source &amp; SaaS
    </text>

    <!-- Tech Pills Tags (Bottom Foreground) -->
    <g transform="translate(340, 252)">
      <!-- Pill 1: dbt -->
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="50" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">dbt Core</text>

      <!-- Pill 2: SQLMesh -->
      <rect x="112" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="162" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">SQLMesh</text>

      <!-- Pill 3: Kestra -->
      <rect x="224" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="274" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Kestra</text>

      <!-- Pill 4: Dataform -->
      <rect x="336" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="386" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Dataform</text>
      
      <!-- Pill 5: Airflow / Dagster -->
      <rect x="448" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
      <text x="498" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Dagster</text>
    </g>
  </g>
</svg>
